[project]
name = "twmedia"
version = "0.1.0"
description = "Measuring partisan leaning of Taiwanese media over time"
authors = [
    { name = "Chih-Kai-Wang", email = "290806361+Chih-Kai-Wang@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cssselect>=1.6.0",
    "httpx>=0.28.1",
    "krippendorff>=0.9.0",
    "lxml>=6.1.3",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
]

[project.scripts]
twmedia = "twmedia.cli:main"

[project.optional-dependencies]
train = [
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
